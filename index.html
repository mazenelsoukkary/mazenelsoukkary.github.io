  :root { --navy:#1c1c1e; --navy2:#2e2e32; --gold:#cc0033; --lite:#ff7a93; --bg:#f6f7f9; --ink:#1b2733; --muted:#5a6773; --line:#dde2e8; --card:#fff; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:72px; }
  body { margin:0; background:var(--bg); color:var(--ink); font:1.05rem/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1,h2,h3 { font-family:"Fraunces",Georgia,"Times New Roman",serif; line-height:1.2; margin:0; }

  a:focus-visible,.btn:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 1.5rem; }

  nav.bar { position:sticky; top:0; z-index:10; background:var(--navy); }
  nav.bar .wrap { display:flex; justify-content:space-between; align-items:center; height:64px; gap:1rem; }
  .brand { color:#fff; font-family:"Fraunces",Georgia,serif; font-weight:700; text-decoration:none; font-size:1.15rem; }
  .links a { color:#d6deea; text-decoration:none; margin-left:1.5rem; font-size:.95rem; font-weight:500; }
  .links a:hover { color:var(--lite); }

  .hero { background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:4.5rem 0; }
  .hero .wrap { display:grid; grid-template-columns:1fr 280px; gap:3rem; align-items:center; }
  .eyebrow { color:var(--lite); text-transform:uppercase; letter-spacing:.12em; font-size:.8rem; font-weight:700; margin:0 0 1rem; }
  .hero h1 { font-size:clamp(1.7rem,3.6vw,2.5rem); font-weight:500; margin-bottom:1.5rem; }
  .contact { color:#c3cedd; margin:0 0 1.75rem; font-size:.98rem; }
  .contact a { color:#fff; }
  .hero a:focus-visible,nav a:focus-visible { outline-color:#fff; }
  .btn { display:inline-block; padding:.7rem 1.4rem; border-radius:6px; font-weight:600; text-decoration:none; margin:0 .6rem .6rem 0; border:2px solid var(--gold); }
  .btn.solid { background:var(--gold); color:#fff; }
  .btn.ghost { color:#fff; }
  .btn:hover { filter:brightness(1.1); }
  .headshot { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; border:4px solid rgba(255,255,255,.2); box-shadow:0 14px 30px rgba(0,0,0,.3); display:block; }

  section { padding:4rem 0; }
  section + section { border-top:1px solid var(--line); }
  h2 { font-size:1.9rem; color:var(--navy); margin-bottom:.4rem; }
  h2::after { content:""; display:block; width:48px; height:3px; background:var(--gold); margin:.7rem 0 2rem; }

  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.5rem; }
  .card h3 { font-size:1.1rem; color:var(--navy); margin-bottom:.9rem; }
  .card ul { list-style:none; margin:0; padding:0; }
  .card li { padding:.4rem 0 .4rem 1.2rem; position:relative; border-bottom:1px solid var(--line); font-size:.98rem; }
  .card li:last-child { border-bottom:0; }
  .card li::before { content:""; position:absolute; left:0; top:1.05em; width:6px; height:6px; background:var(--gold); border-radius:50%; }

  .project { background:var(--card); border:1px solid var(--line); border-top:4px solid var(--navy); border-radius:10px; padding:1.6rem 1.75rem; margin-bottom:1.25rem; }
  .project h3 { font-size:1.3rem; color:var(--navy); margin-bottom:.6rem; }
  .project p { margin:0 0 .8rem; max-width:70ch; }
  .tag { color:var(--muted); font-size:.92rem; font-weight:600; }
  .project a { font-weight:600; }
